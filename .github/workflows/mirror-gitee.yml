# Mirror the GitHub repo to Gitee on every push.
#
# Requires repo secrets:
#   GITEE_PRIVATE_KEY  — ed25519 private key registered on Gitee
#   GITEE_USERNAME     — Gitee username (e.g. zhitong45)
#
# Branches + tags both push. Force-mirror so Gitee tracks GitHub
# 1:1 (any out-of-band edits on Gitee are overwritten — that's the point).

name: Mirror to Gitee

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

concurrency:
  group: mirror-gitee
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check for Gitee secret
        id: gate
        env:
          KEY: ${{ secrets.GITEE_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GITEE_PRIVATE_KEY not set on this repo — skipping mirror. Configure repo secrets GITEE_PRIVATE_KEY + GITEE_USERNAME to enable."
          fi

      - name: Checkout (full history, all refs)
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Gitee SSH key
        if: steps.gate.outputs.run == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GITEE_PRIVATE_KEY }}

      - name: Trust gitee.com host key
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          # Retry: gitee.com is intermittently slow/unreachable from GH runners.
          for i in 1 2 3 4 5; do
            if ssh-keyscan -T 10 -t ed25519 -H gitee.com >> ~/.ssh/known_hosts 2>/dev/null; then
              # keyscan writes nothing on failure; confirm we actually got a key
              if grep -q gitee.com ~/.ssh/known_hosts; then
                exit 0
              fi
            fi
            echo "ssh-keyscan attempt $i failed; retrying..." >&2
            sleep $((i * 3))
          done
          echo "ssh-keyscan gitee.com failed after 5 attempts" >&2
          exit 1

      - name: Push everything to Gitee
        if: steps.gate.outputs.run == 'true'
        env:
          GITEE_USER: ${{ secrets.GITEE_USERNAME }}
          # Keepalive prevents "client_loop: send disconnect: Broken pipe"
          # when Gitee stalls partway through a large push.
          GIT_SSH_COMMAND: "ssh -o ServerAliveInterval=20 -o ServerAliveCountMax=6 -o ConnectTimeout=30"
        run: |
          set -euo pipefail
          REMOTE="git@gitee.com:${GITEE_USER}/solomd.git"
          # Not `--mirror`: in an Actions checkout that also pushes
          # refs/remotes/origin/* ("deny updating a hidden ref" on Gitee).
          # Mirror GitHub's branches (origin/*) and tags explicitly;
          # `--prune` deletes Gitee refs that no longer exist on GitHub.
          git remote set-head origin -d
          # Retry: Gitee occasionally drops the SSH stream mid-push.
          for i in 1 2 3; do
            if git push --prune --force "$REMOTE" \
                "refs/remotes/origin/*:refs/heads/*" \
                "refs/tags/*:refs/tags/*"; then
              exit 0
            fi
            echo "push attempt $i failed; retrying..." >&2
            sleep $((i * 10))
          done
          echo "gitee push failed after 3 attempts" >&2
          exit 1
